name: build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stable:
    name: Verify (Go stable)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Verify
        run: make verify GO_TOOLCHAIN=local GRPC_GO_TOOLCHAIN=local

  test-minimum-versions:
    name: Test (${{ matrix.target }}, Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - go-version: '1.25.12'
            target: test-go125
          - go-version: '1.26.0'
            target: test-grpc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Test
        run: make ${{ matrix.target }} GO_TOOLCHAIN=local GRPC_GO_TOOLCHAIN=local
