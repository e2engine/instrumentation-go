name: build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-stable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Verify
        run: make verify GO_TOOLCHAIN=local

  test-previous-versions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ 1.25.x, 1.26.x ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Test
        run: make test GO_TOOLCHAIN=local